<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sidebar</title><meta name="description" content="Record, transcribe and summarize with 107 professional templates.">
<meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0E1113" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sidebar"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap">
<link rel="stylesheet" href="assets/app.css"></head><body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.4" fill="none" stroke-width="1.1" style="stroke:var(--ink);opacity:.38"/><rect x="8.4" y="8.6" width="2.5" height="14.8" rx="1.25" style="fill:var(--brass)"/><rect x="14.3" y="12.4" width="2.5" height="7.2" rx="1.25" style="fill:var(--ink)"/><rect x="18.5" y="10.2" width="2.5" height="11.6" rx="1.25" style="fill:var(--ink)"/><rect x="22.7" y="13.4" width="2.5" height="5.2" rx="1.25" style="fill:var(--ink)"/></svg><span>Sidebar</span></div>
  <div class="grow"></div>
  <button class="pill" id="engine-pill" type="button" aria-label="AI engine status"><i></i><span>Checking…</span></button>
  <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings"></button>
</header>
<main class="wrap" id="view"></main>
<div class="dock" id="dock">
  <button class="btn" id="import-btn" type="button"></button>
  <button class="rec-btn" id="rec-btn" type="button"><span class="dot"></span><span>Record</span></button>
</div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="sheet" id="rec-sheet" hidden><div class="panel rec-panel" id="rec-panel" role="dialog" aria-modal="true" aria-label="Recorder"></div></div>
<div class="pocket" id="pocket" hidden><div><div class="big mono" id="pocket-clock">00:00</div><div id="pocket-state">Recording</div><button type="button" id="pocket-exit">Show controls</button></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<audio id="aud" preload="metadata"></audio>
<script src="assets/app.js"></script>
</body></html>
